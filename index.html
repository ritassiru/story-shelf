<style>
:root {
  --bg: #F6F0E6; --panel: #FFFDF8; --ink: #2B1721; --muted: #6E5C63; --berry: #6D2E46; --rose: #A26769;
  --cream: #ECE2D0; --line: #D9CBBE; --ok: #3E8E6B; --gold: #C08A2E; --bad: #B0413E; --btn-text: #FFFFFF; --msg: #E3EEF3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1; --berry: #C77A98; --rose: #D19A9C;
    --cream: #3A2830; --line: #4A3540; --ok: #62B891; --gold: #E0AE55; --bad: #E07571; --btn-text: #1E1318; --msg: #243540;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1318; --panel: #2A1C23; --ink: #F1E7EA; --muted: #BFA9B1; --berry: #C77A98; --rose: #D19A9C;
  --cream: #3A2830; --line: #4A3540; --ok: #62B891; --gold: #E0AE55; --bad: #E07571; --btn-text: #1E1318; --msg: #243540;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-size: 1.125rem; line-height: 1.55; }
/* tamanho do texto (configurações): tudo em rem acompanha */
:root[data-size="lg"] { font-size: 112.5%; }
:root[data-size="xl"] { font-size: 125%; }
.wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 36px; }
h1, h2, h3, .ch-title, .brand { font-family: "Fraunces", Georgia, "Times New Roman", serif; font-weight: 800; letter-spacing: -0.01em; }
h1 { font-size: 2.2rem; line-height: 1.05; margin: 0 0 6px; color: var(--berry); }
h2 { font-size: 1.6rem; line-height: 1.15; margin: 0 0 10px; color: var(--berry); }
p { margin: 0 0 12px; }
.hint { color: var(--muted); font-size: 0.95rem; }
button { font: inherit; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.brand { font-size: 1.05rem; color: var(--berry); }
.step { color: var(--muted); font-size: 0.92rem; white-space: nowrap; }
.top.top2 { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.top2 .gear { justify-self: end; }
.top.bar { align-items: center; }
.gear { flex: none; width: 40px; height: 40px; padding: 0; display: grid; place-items: center; cursor: pointer; color: var(--berry); background: none; border: 1.5px solid var(--line); border-radius: 999px; margin-left: auto; }
.gear svg { width: 22px; height: 22px; }
.gear:hover { border-color: var(--rose); }
.no-gloss .gloss { text-decoration: none; cursor: inherit; pointer-events: none; }

/* configurações */
#settings { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(20, 10, 15, 0.55); overflow-y: auto; }
.sheet { width: 100%; max-width: 440px; margin: auto; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; padding: 18px 16px 16px; }
.sheet h2 span { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; font-weight: 400; font-size: 1rem; color: var(--muted); letter-spacing: 0; }
.st-g { margin-bottom: 14px; }
.st-h { font-size: 0.88rem; color: var(--muted); margin: -2px 0 6px; }
.sheet .chip[aria-pressed="true"] b::before { content: "✓ "; color: var(--berry); }
.btn span { font-weight: 400; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--berry); }

/* página do livro */
.page { background: var(--panel); border: 1px solid var(--line); border-radius: 6px 14px 14px 6px; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(43,23,33,.06); overflow: hidden; margin-bottom: 14px; }
.page .scene svg { display: block; width: 100%; height: auto; }
.page-body { padding: 16px 18px 18px; }
.ch-kicker { font-size: 0.8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--rose); font-weight: 700; margin: 0 0 2px; }
.ch-title { font-size: 1.55rem; color: var(--berry); margin: 0 0 12px; line-height: 1.15; }
.story p { font-size: 1.1rem; }
.story p.first::first-letter { font-family: "Fraunces", Georgia, serif; font-weight: 800; float: left; font-size: 3.1em; line-height: .82; padding: 4px 6px 0 0; color: var(--berry); }
.msg { background: var(--msg); border-radius: 14px 14px 14px 4px; padding: 10px 14px; margin: 0 0 12px; font-size: 1.02rem; max-width: 92%; }
.msg::before { content: "💬 New message"; display: block; font-size: 0.75rem; color: var(--muted); margin-bottom: 2px; }
.seq { font-weight: 700; color: var(--berry); }
.pageno { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

/* glossário */
.gloss { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit; text-decoration: underline dotted var(--rose); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.gloss.verb { text-decoration-style: dashed; text-decoration-color: var(--berry); }
/* nível Beginner (A1): sublinhado mais leve, para não pesar o texto */
.gloss.a1 { text-decoration-thickness: 1.5px; text-decoration-color: var(--muted); }
:root:not(.gloss-a1) .gloss.a1 { text-decoration: none; cursor: inherit; pointer-events: none; }
.opt-pt { display: none; font-weight: 400; font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.gloss-a1 .opt-pt { display: block; }
.seq .gloss { font-weight: inherit; color: inherit; }
.nw { white-space: nowrap; }
#tip { position: absolute; z-index: 20; max-width: 280px; display: none; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 0.95rem; padding: 6px 10px; border-radius: 8px; }
#tip.on { display: block; }
#tip .vt { display: grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 4px 14px; }
#tip .vc { padding: 2px 6px; border-radius: 6px; border: 2px solid transparent; }
#tip .vc.on { border-color: var(--gold); }
#tip .vc span { display: block; font-size: 0.72rem; opacity: .8; }
#tip .vpt { margin-top: 6px; }

/* caderno de detetive */
.note { background: var(--panel); border: 2px dashed var(--rose); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.note-k { font-weight: 700; font-size: 0.85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--rose); margin: 0 0 4px; }
.note-q { font-size: 1.12rem; font-weight: 700; margin: 0 0 10px; }
.note-q b { color: var(--berry); }
.opts { display: grid; gap: 8px; }

buddy|parceiro de apoio]] of our new [[exchange student|aluna de intercâmbio]]?”", "Before Kaio could answer, a tall girl with red hair got out of a car. She was carrying a huge backpack, and she looked a little [[lost|perdida]].", "“Hi! I'm Aoife,” she said with a smile. “It's pronounced EE-fa. Don't worry, nobody gets it right the first time.” She was from Galway, a city on the west coast of Ireland, and she was [[going to|vai + verbo (futuro)]] study at IFAL for one semester.", "In the classroom, thirty students [[stared|ficaram olhando fixamente]] at her. Then the teacher turned to Kaio. “Kaio, can you introduce our visitor?”", "Kaio felt his face getting hot. Aoife knew only three words in Portuguese: obrigada, bom dia and tapioca."], "event": "Kaio met Aoife, the new exchange student", "eventPt": "o Kaio conheceu a Aoife, a nova aluna de intercâmbio", "question": {"wh": "What", "q": "What is a “buddy” in this story?", "options": ["A student who helps a new student", "A teacher from Ireland", "A school coordinator", "A type of backpack"], "answer": 0, "hint": "Read what Professor Marcos said."}, "choices": [{"label": "Introduce her in English and translate for the class", "labelPt": "Apresentá-la em inglês e traduzir para a turma", "to": "p2a", "event": "he introduced her in English and translated for the class", "eventPt": "ele a apresentou em inglês e traduziu para a turma"}, {"label": "Let her try to introduce herself in Portuguese", "labelPt": "Deixar que ela tente se apresentar em português", "to": "p2b", "event": "he let her try to speak Portuguese", "eventPt": "ele deixou que ela tentasse falar português"}]}, "p2a": {"chapter": 2, "title": "Twenty Questions", "scene": "classroom", "text": ["Kaio introduced Aoife in English and translated everything. Soon, the whole class was asking her questions.", "“Have you ever eaten tapioca?” asked Júlia. “Not yet,” said Aoife, “but I've already heard a lot about it!” “Have you ever seen snow?” asked someone else. “Yes, a few times,” she laughed, “but I've never seen a beach as warm as yours.”", "Then Aoife turned to Kaio. “And you? Have you ever been [[abroad|no exterior]]?” Kaio shook his head. “I've never left Alagoas,” he admitted.", "At lunch, however, something happened. While Aoife was waiting in line, Tiago, the [[class clown|palhaço da turma]], started to imitate her [[accent|sotaque]]: “Hi! I'm from Ai-er-land!” A few students laughed. Aoife [[pretended|fingiu]] not to hear, but her [[cheeks|bochechas]] turned red.", "After that, Tiago looked at Kaio, waiting for him to laugh too."], "event": "Tiago imitated Aoife's accent at lunch", "eventPt": "o Tiago imitou o sotaque da Aoife no almoço", "question": {"wh": "Why", "q": "Why did Aoife's cheeks turn red?", "options": ["She was embarrassed by Tiago's imitation", "She was hot because of the sun", "She was angry with Kaio", "She ate spicy food"], "answer": 0, "hint": "Read the fourth paragraph and think about how she felt."}, "choices": [{"label": "Laugh along. It's just a joke", "labelPt": "Rir junto. É só uma piada", "to": "p3y", "event": "he laughed at Tiago's joke", "eventPt": "ele riu da piada do Tiago", "set": ["laughed"]}, {"label": "Tell Tiago to stop", "labelPt": "Pedir para o Tiago parar", "to": "p3x", "event": "he told Tiago to stop", "eventPt": "ele pediu para o Tiago parar", "set": ["defended"]}]}, "p2b": {"chapter": 2, "title": "Portuguese, Please", "scene": "classroom", "text": ["“Try in Portuguese,” Kaio [[whispered|sussurrou]]. “Everybody will love it.” First, Aoife looked at the class. Then she took a deep breath.", "“Bom dia. Eu... chamar... Aoife. Eu... ser... da Irlanda,” she said slowly. For a moment, nobody said anything. Then Tiago, the [[class clown|palhaço da turma]], repeated her words with a funny voice, and half of the class laughed.", "Aoife smiled, but her hands were [[shaking|tremendo]]. She sat down and didn't speak for the rest of the morning.", "At the end of the day, she found Kaio at ctice languages", "eventPt": "o Kaio e a Aoife fizeram um acordo para praticar idiomas", "question": {"wh": "How long", "q": "How long was Aoife in Brazil when she asked about the weekends?", "options": ["Three weeks", "Three months", "One semester", "Two days"], "answer": 0, "hint": "Read what Aoife said on Friday."}, "choices": [{"label": "Take her to the town festival", "labelPt": "Levá-la à festa da cidade", "to": "p4a", "event": "he took her to the town festival", "eventPt": "ele a levou à festa da cidade"}, {"label": "Take her to the mall in Maceió", "labelPt": "Levá-la ao shopping em Maceió", "to": "p4b", "event": "he took her to the mall in Maceió", "eventPt": "ele a levou ao shopping em Maceió", "set": ["mall"]}]}, "p3y": {"chapter": 3, "title": "The Video", "scene": "phone_video", "text": ["Kaio laughed. It was just a joke, he thought. Tiago was always joking with everybody.", "But that night, Tiago posted a video of his imitation in the class group chat. By the morning, it had more than three hundred views, and people from other classes were repeating it in the corridors.", "Aoife didn't say anything. However, she started eating lunch alone, with her headphones on. When Kaio sat next to her, she answered with short sentences: “Yes.” “No.” “I'm fine.”", "On Thursday, Júlia [[pulled Kaio aside|chamou o Kaio num canto]]. “She saw you laughing, you know,” she said. “I think she's really hurt. Have you talked to her since Monday?” Kaio realized that he hadn't."], "event": "Tiago posted the video in the group chat", "eventPt": "o Tiago postou o vídeo no grupo da turma", "question": {"wh": "How many", "q": "How many views did the video have by the morning?", "options": ["More than three hundred", "About thirty", "Only ten", "More than three thousand"], "answer": 0, "hint": "Read the second paragraph."}, "choices": [{"label": "Apologize to Aoife", "labelPt": "Pedir desculpas à Aoife", "to": "p4b", "event": "he apologized to Aoife", "eventPt": "ele pediu desculpas g on the [[accordion|sanfona]]. Suddenly, Aoife stopped. “This sounds a bit like Irish music!” she said, and she showed them a few steps of an Irish dance. A small crowd [[gathered|se juntou]] around them and clapped.", "On the way home, Aoife was quiet for a while. Then she said: “The program has asked me if I want to stay for another semester. I have to decide by Friday. What do you think?”"], "event": "Aoife danced forró with Kaio's grandmother", "eventPt": "a Aoife dançou forró com a avó do Kaio", "question": {"wh": "Where", "q": "Where was the festival?", "options": ["In the town square", "At the school", "At the mall in Maceió", "In Galway"], "answer": 0, "hint": "Read the first sentence."}, "choices": [{"label": "Tell her to stay another semester", "labelPt": "Pedir para ela ficar mais um semestre", "to": "e1", "event": "he told her to stay another semester", "eventPt": "ele disse para ela ficar mais um semestre"}, {"label": "Help her organize a culture afternoon at school", "labelPt": "Ajudá-la a organizar uma tarde cultural na escola", "to": "e2", "event": "he helped her organize a culture afternoon", "eventPt": "ele a ajudou a organizar uma tarde cultural"}]}, "p4b": {"chapter": 4, "title": "The Invitation", "scene": "library", "text": [{"if": "mall", "text": "At the mall, Aoife looked around politely. “It's... exactly like the malls at home,” she said. She bought a keychain, and they took the bus back. It was a nice day, but not a special one."}, {"if": "laughed", "text": "Kaio apologized. “I shouldn't have laughed,” he said. Aoife accepted his apology, but after that, she was more careful with him."}, "Then the weeks went by, and Aoife's Portuguese was getting better, although she still made funny mistakes.", "Finally, near the end of the semester, Professor Marcos invited her to give a short presentation about Ireland to the whole school, in Portuguese. “I've never spoken in front of so many people,” she told Kaio. “And in Portuguese! Will you help me prepare it?”", "Kaio [[hesitated|hesitou]]. He had two tests that week and a project for his programming class."], "event": "Aoife was invited to give a presentation", "eventPt": "a Aoife foi convidada para fazer uma apresentação", "question": {"wh": "Who", "q": "Who invited Aoife to give a presentation?", "options": ["Professor Marcos", "Tiago", "Júlia", "Kaio's grandmother"], "answer": 0, "hint": "Read the fourth paragraph."}, "choices": [{"label": "Help her write the presentation", "labelPt": "Ajudá-la a escrever a apresentação", "to": "e4", "event": "he helped her write the presentation", "eventPt": "ele a ajudou a escrever a apresentação"}, {"label": "Say you're too busy", "labelPt": "Dizer que você está ocupado demais", "to": "e3", "event": "he said he was too busy", "eventPt": "ele disse que estava ocupado demais"}]}, "p4c": {"chapter": 4, "title": "Too Late?", "scene": "empty_desk", "text": ["Kaio decided not to do anything. After all, Aoife was only [[going to|vai + verbo (futuro)]] stay for one semester.", {"if": "laughed", "text": "Meanwhile, Tiago's video kept [[circulating|circulando]]. Someone made a sticker with Aoife's face, and it appeared in every group chat at school."}, "Aoife became quieter every week. She stopped coming to school events, and she sat alone at the back of the classroom.", "One Monday, her desk was empty. Later, Kaio saw Professor Marcos in the corridor and asked about her. “She's thinking about going home early,” he said. “She has told me that she's very unhappy here. Do you know why?”"], "event": "Aoife's desk was empty", "eventPt": "a carteira da Aoife estava vazia", "question": {"wh": "When", "q": "When was Aoife's desk empty?", "options": ["One Monday", "On her first day", "On the day of the festival", "Last semester"], "answer": 0, "hint": "Read the last paragraph."}, "choices": [{"label": "Go and talk to her now", "labelPt": "Ir falar com ela agora", "to": "e3", "event": "he finally went to talk to her", "eventPt": "ele finalmente foi falar com ela"}, {"label": "Do nothing. It's not your problem", "labelPt": "Não fazer nada. O problema não é seu", "to": "e5", "event": "he did nothing", "eventPt": "ele não fez nada", "alt": [{"if": "laughed", "to": "e6"}]}]}, "p4d": {"chapter": 4, "title": "Study Group", "scene": "study_group", "text": ["Kaio invited Aoife to study with Júlia and two other friends in the library. At first, she was shy. However, when Júlia asked for help with an English exercise, Aoife explained it so clearly that everybody applauded.", "After that, the study group became a daily [[meeting|encontro]]. They helped her with Portuguese, she helped them with English, and they asked each other [[endless|sem fim]] questions: “Have you ever eaten jaca?” “Have you ever tried Irish soda bread?”", "Later, one afternoon, Aoife looked at the group and smiled. “You know, I almost went home early last month,” she said. “I'm really glad I didn't.”"], "event": "Aoife joined Kaio's study group", "eventPt": "a Aoife entrou no grupo de estudos do Kaio", "question": {"wh": "Where", "q": "Where did the study group meet?", "options": ["In the library", "At Kaio's house", "At the mall", "In the town square"], "answer": 0, "hint": "Read the first paragraph."}, "choices": [{"label": "Take her to the town festival with the group", "labelPt": "Levá-la à festa da cidade com o grupo", "to": "e1", "event": "they took her to the town festival", "eventPt": "eles a levaram à festa da cidade"}, {"label": "Organize a culture afternoon with the group", "labelPt": "Organizar uma tarde cultural com o grupo", "to": "e2", "event": "they organized a culture afternoon", "eventPt": "eles organizaram uma tarde cultural"}]}}, "endings": {"e1": {"rank": 0, "tier": "good", "emoji": "🍀", "short": "Best friends", "title": "Best Friends", "scene": "friends_photo", "text": ["Aoife decided to stay for another semester. When she told the class, everybody [[cheered|comemorou]], even Tiago.", "Later, in December, she flew to /* verbos irregulares: forma escrita -> { i, cols }; cols: 0 = infinitive, 1 = past, 2 = participle.

const VERB = new Map(), VERB3 = new Map();

  const NO_BASE = new Set(["have", "do"]);
  const DOUBLE = new Set(["get", "run", "win", "put", "cut", "set", "let", "begin", "sit", "forget"]);
  const sForm = b => /(s|sh|ch|x|o)$/.test(b) ? b + "es" : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + "ies" : b + "s";

  const add = (k, i, col) => { if (!VERB.has(k)) VERB.set(k, { i, cols: [] }); if (col !== null && !VERB.get(k).cols.includes(col)) VERB.get(k).cols.push(col); };

    if (!NO_BASE.has(b)) { add(b, i, 0); if (b !== "be") add(sForm(b), i, 0); add(ing(b), i, null); }
    p.split(" / ").forEach(f => add(f, i, 1));
    if (VERB === VERB3) pp.split(" / ").forEach(f => add(f, i, 2));

// "going to" + verbo é futuro, não o verbo go (senão o balão mostraria go · went).
// Antes de artigo, possessivo ou lugar ("going to school") continua sendo o verbo go.
// A mesma regra está em checar.py (GOING_TO): se mudar aqui, mude lá.
const GOING_TO = /\b(going to)(?=\s+(?!(?:the|a|an|my|your|his|her|its|our|their|this|that|these|those|school|bed|sleep|work|church|class|town|home)\b)[a-z])/i;
function verbWrap(plain) {
  const future = plain.split(GOING_TO);
  if (future.length > 1) return future.map((part, i) => i % 2 ? `<button type="button" class="gloss" data-pt="vai + verbo (futuro)">${esc(part)}</button>` : verbWrap(part)).join("");

  return plain.split(/([A-Za-zÀ-ÿ]+(?:['’][A-Za-zÀ-ÿ]+)?)/).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const key = part.toLowerCase().replace("’", "'");
    const v = (verbForms() === 3 ? VERB3 : VERB).get(key);
    if (v) return `<button type="button" class="gloss verb" data-v="${v.i}" data-cols="${v.cols.join(",")}">${esc(part)}</button>`;
    // nível Beginner: quase todas as palavras (só aparecem com esse nível ligado)
    const a = A1[key];
    if (!a) return esc(part);
    const [base, pt] = a.includes("|") ? a.split("|") : ["", a];
    return `<button type="button" class="gloss a1" data-pt="${esc(pt)}"${base ? ` data-base="${esc(base)}"` : ""}>${esc(part)}</button>`;
  }).join("");
}

  return seg.split(/(\b(?:first|then|after that|next|suddenly|later|finally|in the end)\b)/i).map((s, i) =>

}
function rich(text) {
  const html = text.split(/(\[\[[^\]]+\]\])/).map(seg => {
    const g = seg.match(/^\[\[([^|\]]+)\|([^\]]+)\]\]$/);
    return g ? `<button type="button" class="gloss" data-pt="${esc(g[2])}">${esc(g[1])}</button>` : plainRich(seg);
  }).join("");
  // a pontuação colada à palavra (antes: “ ‘ ( ; depois: , . ! ” ...) fica na mesma linha que ela
  return html.replace(/([“‘(]+)?(<button type="button" class="gloss[^>]*>[^<]*<\/button>)((?:<\/span>)?[,.;:!?”’)]+)?/g, (m, antes, _, depois) => antes || depois ? `<span class="nw">${m}</span>` : m);

/* Ilustrações de "Who Posted It?".

  extra: '<circle cx="-5" cy="-68" r="5" fill="none" stroke="#2B1721" stroke-width="1.5"/><circle cx="5" cy="-68" r="5" fill="none" stroke="#2B1721" stroke-width="1.5"/>' };

// variações de um personagem: mk(DAVI, SAD(DAVI.skin), ...) acrescenta desenhos ao "extra"
const mk = (o, ...ex) => Object.assign({}, o, { extra: (o.extra || "") + ex.join("") });
const at = (o, s) => Object.assign({}, o, { s });
const MOUTH = sk => `<rect x="-6" y="-64" width="12" height="8" fill="${sk}"/>`;
const SAD = sk => MOUTH(sk) + '<path d="M-4 -58 Q0 -62 4 -58" stroke="#5A2A2A" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
const LAUGH = sk => MOUTH(sk) + '<path d="M-5 -62 Q0 -53 5 -62 Z" fill="#5A2A2A"/>';
const WORRY = sk => MOUTH(sk) + '<path d="M-5 -59 q2.5 -2.5 5 0 q2.5 2.5 5 0" stroke="#5A2A2A" stroke-width="1.6" fill="none" stroke-linecap="round"/>';
const ANGRY = sk => SAD(sk) + '<path d="M-9 -76 L-2 -73 M9 -76 L2 -73" stroke="#2B1721" stroke-width="2" stroke-linecap="round"/>';
const SWEAT = '<path d="M15 -82 q4 6 0 9 q-4 -3 0 -9 Z" fill="#9FD3E6"/>';
const ARM = (o, x2, y2, left) => `<path d="M${left ? -14 : 14} -36 L${x2} ${y2}" stroke="${o.shirt}" stroke-width="9" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="5" fill="${o.skin}"/>`;
const HAT = '<path d="M-24 -80 Q0 -87 24 -80 Q0 -74 -24 -80 Z" fill="#E0C27A"/><path d="M-11 -81 Q-10 -98 0 -98 Q10 -98 11 -81 Z" fill="#E0C27A"/><rect x="-11" y="-86" width="22" height="3" fill="#B5483A"/>';
const SKIRT = c => `<path d="M-20 -18 L-33 6 L33 6 L20 -18 Z" fill="${c}"/>` + [[-18, -2], [0, -8], [16, 0], [-6, 2]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="#F3D36B"/>`).join("");
const HELD = (x, y) => `<rect x="${x - 6}" y="${y - 10}" width="12" height="20" rx="2.5" fill="#2B1721"/><rect x="${x - 4.5}" y="${y - 8}" width="9" height="14" rx="1" fill="#9FD3E6"/>`;

const PHONE = (x, y, glow) => `<g transform="translate(${x} ${y})">${glow ? '<circle r="18" fill="#FFF3B0" opacity=".5"/>' : ""}<rect x="-6" y="-10" width="12" height="20" rx="2.5" fill="#2B1721"/><rect x="-4.5" y="-8" width="9" height="14" rx="1" fill="#9FD3E6"/></g>`;
const FLAGS = ["#E0AE55", "#6D2E46", "#3E7C8E", "#A26769", "#5D8963", "#FFFDF8"];
const BUNT = pts => {  // bandeirinhas ao longo de uma corda (lista de pontos [x, y])
  let s = `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="#6B4A32" stroke-width="1.5"/>`, k = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[i + 1], n = Math.max(1, Math.floor(Math.hypot(x2 - x1, y2 - y1) / 24)), a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    for (let j = 0; j < n; j++) {
      const t = (j + .5) / n;
      s += `<path transform="translate(${(x1 + (x2 - x1) * t).toFixed(1)} ${(y1 + (y2 - y1) * t).toFixed(1)}) rotate(${a.toFixed(1)})" d="M-8 0 L8 0 L0 14 Z" fill="${FLAGS[k++ % FLAGS.length]}"/>`;
    }
  }
  return s;
};
const ROPE = y => [[0, y], [90, y + 14], [180, y + 20], [270, y + 14], [360, y + 20], [450, y + 14], [540, y]];
const ARROW = (x1, y1, x2, y2, c) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path transform="translate(${x2} ${y2}) rotate(${(Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI).toFixed(1)})" d="M2 0 L-10 -7 L-10 7 Z" fill="${c}"/>`;

  <path d="M-22 -6 Q-28 -32 -8 -46 Q-10 -30 0 -26 Q-2 -52 12 -64 Q12 -38 22 -32 Q28 -18 22 -6 Z" fill="#E0703A"/><path d="M-12 -6 Q-14 -24 -2 -32 Q0 -20 6 -18 Q8 -32 14 -36 Q18 -18 12 -6 Z" fill="#F3D36B"/></g>`;
const CHAIR = x => `<g transform="translate(${x} 190)"><rect x="-12" y="-46" width="24" height="22" rx="3" fill="#A98468"/><rect x="-13" y="-24" width="26" height="5" fill="#8E6A55"/><rect x="-12" y="-19" width="4" height="19" fill="#8E6A55"/><rect x="8" y="-19" width="4" height="19" fill="#8E6A55"/></g>`;
const STARS = [[40, 20], [120, 44], [200, 16], [330, 30], [420, 14], [500, 46], [270, 52]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.6" fill="#F3E9D2"/>`).join("");
const NIGHT = () => `${SKY("#1F2A44", "#4A3A5C")}${STARS}`;

  ${STAND(18, true)}${STAND(418, full)}${GROUND("#6B5344")}${FIRE(270, full ? 1 : .6)}`;

const scene = (slug, k, label) => `<div class="scene"><svg viewBox="0 0 540 220" role="img" aria-label="${esc(label)}">${SCENE_LIB[slug][k]()}</svg></div>`;

/* ---------------- estado ---------------- */
let book = null, state = null;
const BOOKS = SHELF.books;
const bookBy = slug => BOOKS.find(b => b.slug === slug);
function openBook(slug) { book = bookBy(slug); document.title = `${book.title} · ${SHELF.title}`; }
function newGame() { state = { slug: book.slug, flags: [], node: book.story.start, path: [], answers: [], ended: null, saved: false, resumed: false, t0: Date.now() }; }
const visible = p => typeof p === "string" || ((!p.if || state.flags.includes(p.if)) && (!p.unless || !state.flags.includes(p.unless)));
const endingOrder = b => Object.keys(b.story.endings).sort((x, y) => b.story.endings[x].rank - b.story.endings[y].rank);
const R = () => Object.assign({ sentences: 5, minSequence: 3, maxHelp: 3 }, book.retell || {});

function topBar(step) {
  const n = state.path.length, total = book.chapters + 1;
  const dots = Array.from({ length: total }, (_, i) => `<i class="${i <= n ? "on" : ""}"></i>`).join("");
  return `<div class="top"><div class="brand">${esc(book.title)}</div><div class="step">${step}</div></div><div class="top top2"><span></span><div class="dots" aria-hidden="true">${dots}</div>${gearButton()}</div>`;
}

/* ---------------- navegação: #slug abre direto a capa de um livro ---------------- */
function route() {
  const pend = store.get(KEY.pending, null);
  if (pend && bookBy(pend.slug) && pend.state && pend.state.ended) {
    // leitura terminada sem o reconto: volta para onde parou, venha de onde vier
    openBook(pend.slug); state = Object.assign(pend.state, { resumed: true });
    if (state.saved) screenRetell(); else screenEnding(state.ended);
    return;
  }
  const slug = decodeURIComponent(location.hash.slice(1));
  if (slug && bookBy(slug)) { openBook(slug); screenCover(); } else screenShelf();
}
window.addEventListener("hashchange", route);
const goShelf = () => { if (location.hash) location.hash = ""; else route(); };
const goBook = slug => { if (location.hash === "#" + slug) route(); else location.hash = slug; };

/* ---------------- estante ---------------- */
function screenShelf() {
  book = null; document.title = SHELF.title;
  $("#app").innerHTML = `<div class="top bar">${gearButton()}</div><div class="shelf-head"><h1>${esc(SHELF.title)}</h1><p class="hint">${esc(SHELF.subtitle)}</p></div>
    ${BOOKS.map(b => {
      const found = foundOf(b.slug).size, total = Object.keys(b.story.endings).length;
      const reads = store.get(KEY.history, []).filter(h => h.slug === b.slug).length;
      return `<div class="book"><div class="thumb">${scene(b.slug, b.cover, b.title)}</div><div>
        <h3>${esc(b.title)}</h3><div class="chiprow"><span class="mini lvl">${esc(b.level)}</span>${b.grammar.map(g => `<span class="mini">${esc(g)}</span>`).join("")}</div>
        <p>${esc(b.blurb)}</p><div class="prog">${found ? `🗺️ ${found} of ${total} endings found` : `${total} endings to discover`}${reads ? ` · read ${reads}×` : ""}</div>
        <button class="btn primary" data-book="${esc(b.slug)}">Read</button></div></div>`;
    }).join("")}<div class="shelf-plank" aria-hidden="true"></div>${wordsHomeHTML()}`;
  document.querySelectorAll("[data-book]").forEach(b => b.onclick = () => goBook(b.dataset.book));
  window.scrollTo(0, 0);
}

/* ---------------- capa do livro ---------------- */
function screenCover() {
  const total = Object.keys(book.story.endings).length;
  $("#app").innerHTML = `<div class="top bar"><button class="back" id="shelf">← ${esc(SHELF.title)}</button>${gearButton()}</div>` +
    `<div class="page">${scene(book.slug, book.cover, book.title)}
    <div class="page-body cover-t"><span class="lvl">Graded reader · ${esc(book.level)}</span><h1>${esc(book.title)}</h1>
      <p>${esc(book.blurb)}</p>
      <p class="hint">${book.chapters} choices · ${total} different endings · a detective notebook</p>
      <button class="btn primary" id="go">Open the book</button></div></div>` + historyHTML();
  $("#shelf").onclick = goShelf;
  $("#go").onclick = () => { newGame(); screenBefore(); };
  const clr = $("#clear");
  if (clr) { let armed = null; clr.onclick = () => {
    if (armed) { clearTimeout(armed); store.del(KEY.found(book.slug)); store.set(KEY.history, store.get(KEY.history, []).filter(h => h.slug !== book.slug)); screenCover(); return; }
    clr.innerHTML = "Tap again to delete <span>· toque de novo para apagar</span>";
    armed = setTimeout(() => { armed = null; clr.innerHTML = "Clear my history <span>· apagar meu histórico deste livro</span>"; }, 4000); }; }
  window.scrollTo(0, 0);
}

function screenBefore() {
  const groups = book.keywords.map(g => typeof g === "string" ? BUILTIN_KW[g] : g);
  $("#app").innerHTML = `<div class="top bar"><div class="brand">${esc(book.title)}</div>${gearButton()}</div><div class="card"><p class="ch-kicker">Before you read</p><h2>Key words</h2>
    <p class="hint">Palavras importantes da história. Leia antes de começar.</p>
    ${groups.map(g => `<p class="kw-g">${esc(g.title)} <span>· ${esc(g.pt)}</span></p><div class="kw-grid">${g.words.map(([e, en, pt]) => {
      const v = IRREG.find(x => x[0] === en); return `<div class="kw"><span class="kw-e" aria-hidden="true">${e}</span><div><b>${esc(en)}</b><span class="pt">${esc(pt)}${v ? " · past: " + esc(v[1]) + (verbForms() === 3 ? " · participle: " + esc(v[2]) : "") : ""}</span></div></div>`; }).join("")}</div>`).join("")}
    <p class="hint" style="margin-top:14px">Depois de cada capítulo, o seu <b>caderno de detetive</b> faz uma pergunta sobre o que você leu. Acerte para continuar!</p>
    <button class="btn primary" id="go">Start reading</button></div>`;
  $("#go").onclick = () => screenNode(book.story.start);
  window.scrollTo(0, 0);
}

// o texto visível de um capítulo ou final, para o botão 🔊
// cada parágrafo termina numa pausa, mesmo sem ponto final (as mensagens de celular, por exemplo)
const textoVisivel = list => list.filter(visible).map(p => (typeof p === "string" ? p : (p.text || p.msg || "")).trim())
  .map(t => /[.!?”"’)]$/.test(t) ? t : t + ".").join(" ");
function paragraphs(list) {
  let first = true;
  return list.filter(visible).map(p => {
    if (typeof p === "object" && p.msg) return `<div class="msg">${rich(p.msg)}</div>`;
    const t = typeof p === "string" ? p : p.text;
    const cls = first ? ' class="first"' : ""; first = false;
    return `<p${cls}>${rich(t)}</p>`;
  }).join("");
}
function questionHTML(q) {
  const opts = shuffle(q.options.map((o, i) => [o, i]));
  const qt = esc(q.q).replace(new RegExp("^(" + esc(q.wh) + ")", "i"), "<b>$1</b>");
  return `<div class="note" id="note"><p class="note-k">🔍 Detective notebook</p><p class="note-q">${qt}</p>
    <div class="opts">${opts.map(([o, i]) => `<button type="button" class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <div class="fb" id="qfb"></div></div>`;
}
function wireQuestion(id, q, onRight) {
  let tries = 0;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === q.answer) {
      b.classList.add("right"); document.querySelectorAll(".opt").forEach(x => x.disabled = true);
      $("#qfb").textContent = tries === 0 ? "✓ Correct! Great detective work." : "✓ Correct!"; $("#qfb").className = "fb ok";
      state.answers.push({ id, wh: q.wh, q: q.q, a: q.options[q.answer], first: tries === 0 });
      onRight();
    } else {
      tries++; b.classList.add("wrong"); b.disabled = true;
      $("#qfb").textContent = "Not this one. Tip: " + q.hint; $("#qfb").className = "fb no";
    }
  });
}

function screenNode(id) {
  state.node = id;
  const n = book.story.nodes[id];
  let sc = n.scene; (n.sceneIf || []).forEach(a => { if (state.flags.includes(a.if)) sc = a.scene; });
  $("#app").innerHTML = topBar(`Chapter ${n.chapter} of ${book.chapters}`) + `<div class="page">${scene(book.slug, sc, n.title)}
    <div class="page-body"><p class="ch-kicker">Chapter ${n.chapter}</p><div class="ch-title">${esc(n.title)}</div>
    ${sayButton(n.title + ". " + textoVisivel(n.text))}<div class="story">${paragraphs(n.text)}</div><div class="pageno">— ${n.chapter * 2 + 1} —</div></div></div>
    ${questionHTML(n.question)}<div id="choices" hidden><p class="choose-t">${esc(book.choicePrompt)}</p><div class="choices">
      ${n.choices.map((c, i) => `<button type="button" class="btn" data-choice="${i}">${esc(c.label)}${c.labelPt ? `<span class="opt-pt">${esc(c.labelPt)}</span>` : ""}</button>`).join("")}</div></div>`;
  wireQuestion(id, n.question, () => { $("#choices").hidden = false; $("#choices").scrollIntoView({ behavior: smooth(), block: "nearest" }); });
  document.querySelectorAll("#choices [data-choice]").forEach(b => b.onclick = () => choose(id, n.choices[+b.dataset.choice]));
  window.scrollTo(0, 0);
}
function choose(id, c) {
  const n = book.story.nodes[id];
  (c.set || []).forEach(f => { if (!state.flags.includes(f)) state.flags.push(f); });
  state.path.push({ id, event: n.event, eventPt: n.eventPt, choice: { label: c.label, event: c.event, eventPt: c.eventPt } });
  let to = c.to; (c.alt || []).forEach(a => { if (state.flags.includes(a.if)) to = a.to; });
  if (book.story.endings[to]) screenEnding(to); else screenNode(to);
}

const savePending = () => store.set(KEY.pending, { slug: book.slug, state });
const firstTry = () => state.answers.filter(a => a.first).length;
function screenEnding(id) {
  const e = book.story.endings[id], total = Object.keys(book.story.endings).length;
  state.ended = id;
  const found = foundOf(book.slug); const isNew = !found.has(id); found.add(id); store.set(KEY.found(book.slug), [...found]);
  savePending();

function checkSentence(s) {
  const t = s.trim();
  if (t.split(/\s+/).filter(Boolean).length < 4) return { ok: false, msg: "Write a complete sentence (at least 4 words)." };
  if (!hasPast(t)) return { ok: false, msg: "Use a verb in the past: found, went, called, looked..." };
  // dicas (a frase passa assim mesmo): erros típicos com o passado
  const low = t.toLowerCase().replace(/[’]/g, "'"), dicas = [];
  // did/didn't + passado: confere a palavra seguinte e a outra (did she found)
  const passado = w => !!w && (IRREG_PAST.has(w) || (/ed$/.test(w) && w.length > 3 && !NOT_PAST.has(w)));
  const d = low.match(/\b(did not|didn't|did)\s+([a-z]+)(?:\s+([a-z]+))?/);
  const dw = d && (passado(d[2]) ? d[2] : passado(d[3]) ? d[3] : null);
  if (dw) dicas.push(`depois de ${d[1]}, o verbo fica na forma base: ${d[1]} ${IRREG_PAST.get(dw) || "+ verbo sem -ed"} (não ${d[1]} ${dw})`);
  (low.match(/[a-z]+/g) || []).forEach(w => {
    if (WRONG_PAST.has(w)) dicas.push(`${w} → ${WRONG_PAST.get(w)} (verbo irregular)`);
    else if (/[^aeiou]yed$/.test(w)) dicas.push(`${w} → ${w.replace(/yed$/, "ied")} (y vira ied)`);
  });
  if (dicas.length) return { ok: true, msg: "Good! Tip · dica: " + [...new Set(dicas)].join("; ") + "." };
  return { ok: true, msg: "Good!" };
}
// apoio para as dicas: passado irregular -> forma base (went -> go) e passado "regularizado" errado (goed -> went);
// NOT_PAST tira as palavras de verdade que a regra geraria (bed, seed)
const IRREG_PAST = new Map(), WRONG_PAST = new Map();
IRREG.forEach(([b, p]) => p.split(" / ").forEach(f => {
  if (f === b) return;
  if (!IRREG_PAST.has(f)) IRREG_PAST.set(f, b);
  [b + "ed", b.replace(/e$/, "") + "ed", b.replace(/y$/, "ied")].forEach(w => { if (w !== f && w !== b && !NOT_PAST.has(w) && !WRONG_PAST.has(w)) WRONG_PAST.set(w, p); });
}));
function checkAll() {

  else { ov.textContent = `Sequence words: ${[...seq].join(", ")} ✓`; ov.className = "fb ok"; }
  lockAgain(!all);
  const done = $("#done");
  if (all) { const own = cfg.sentences - helped.size; done.textContent = `Your story is ready! Copy it into your notebook. (${helped.size} com ajuda, ${own} ${own === 1 ? "escrita" : "escritas"} por você)`; done.hidden = false; }

const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
let voz = null, falando = null;   // falando: o botão 🔊 que está lendo agora
function escolheVoz() {
  if (!synth) return null;
  const vs = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
  // vozes do próprio aparelho primeiro (funcionam sem internet)
  return vs.find(v => v.localService && /en[-_](US|GB)/i.test(v.lang)) || vs.find(v => v.localService) || vs[0] || null;
}
const podeFalar = () => !!(synth && (voz = voz || escolheVoz()));
if (synth) synth.addEventListener("voiceschanged", () => { voz = escolheVoz(); applySettings(); });
// texto que vai para a voz: sem [[glossário]], sem emojis, com o nome da empresa; "go · went" vira "go, went"
const paraFalar = t => String(t).replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g, "$1").replace(/\{name\}/g, (typeof state !== "undefined" && state && state.name) || "")
  .replace(/\p{Extended_Pictographic}|️|‍/gu, "").replace(/\s·\s/g, ", ").replace(/\s+/g, " ").trim();
// divide em frases só onde há pontuação seguida de espaço ("8.5" fica inteiro) e não depois de Mr./Ms./Dr. nem antes de minúscula (“Why?” she asked)
function frases(t) {
  const out = [];
  t.split(/([.!?]+[”"’]?\s+)/).forEach((x, i) => {
    if (i % 2) { out[out.length - 1] += x; return; }
    const ant = out[out.length - 1];
    if (ant !== undefined && (/\b(Mr|Ms|Mrs|Dr)\.\s*$/.test(ant) || /^[a-z]/.test(x))) out[out.length - 1] += x; else out.push(x);
  });
  return out.map(x => x.trim()).filter(Boolean);
}
function fala(texto, botao) {

  try {
    synth.cancel(); paraBotao();
    // frase por frase: alguns navegadores cortam leituras longas no meio
    const partes = frases(paraFalar(texto));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p);
      u.voice = voz; u.lang = voz.lang; u.rate = SET.audio === "slow" ? 0.7 : 0.95;
      if (botao && i === partes.length - 1) { u.onend = u.onerror = () => { if (falando === botao) paraBotao(); }; }
      synth.speak(u);
    });
    if (botao) { falando = botao; botao.setAttribute("aria-pressed", "true"); botao.querySelector("span").textContent = "Stop · parar"; }
  } catch (e) { /* sem voz: o jogo funciona igual */ }
}

  falando = null;
}

    return;
  }
  const c = e.target.closest(".chip[data-k]");
  if (!c) return;
  SET[c.dataset.k] = c.dataset.v; store.set(KEY[c.dataset.k], c.dataset.v);
  applySettings();
  o.querySelectorAll(`.chip[data-k="${c.dataset.k}"]`).forEach(b => b.setAttribute("aria-pressed", b === c));
});
document.addEventListener("keydown", e => {
  const o = $("#settings");
  if (o.hidden) return;
  if (e.key === "Escape") { closeSettings(); return; }
  if (e.key !== "Tab") return;
  // o foco fica dentro do painel enquanto ele está aberto
  const f = [...o.querySelectorAll("button")], first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
applySettings();

/* ---------------- My words: as palavras consultadas no glossário (ficam só no aparelho) ---------------- */
// vale para a estante toda (reader:words)
const loadWords = () => { const v = store.get(KEY.words, []); return Array.isArray(v) ? v : []; };
const saveWords = ws => store.set(KEY.words, ws.slice(0, 300));
// en: como a palavra aparece na lista (verbos com as formas); k: chave única
function rememberWord(k, en, pt) {
  const ws = loadWords(), i = ws.findIndex(w => w.k === k);
  const w = i >= 0 ? ws.splice(i, 1)[0] : { k, n: 0, ok: 0 };
  Object.assign(w, { en, pt, t: Date.now() }); w.n++;
  saveWords([w, ...ws]);
}
const wordOf = g => { const s = (g.dataset.base || g.textContent).trim(); return s.length <= 3 && s === s.toUpperCase() ? s : s.toLowerCase(); };
const wordsList = ws => `<ul class="wlist">${ws.map(w => `<li><b>${esc(w.en)}</b> <span>= ${esc(w.pt)}</span></li>`).join("")}</ul>`;
const reviewButton = () => `<button type="button" class="help-btn" id="w-review">Review my words <span>· revisar em cartões</span></button>`;

// no fim da leitura (caderno): as palavras consultadas nesta leitura
function wordsCardHTML(since) {
  const all = loadWords(), now = all.filter(w => w.t >= since);
  return `<div class="card" id="w-end" data-since="${since}"><p class="sec-t" style="margin-top:0">My words <span>· minhas palavras</span></p>
    ${now.length ? `<p class="hint">As palavras que você consultou nesta leitura. Copie no caderno!</p>${wordsList(now)}`
                 : `<p class="hint">Você não consultou nenhuma palavra nesta leitura.${all.length ? "" : " Toque nas palavras sublinhadas durante a leitura: elas ficam guardadas aqui para você revisar depois."}</p>`}
    ${all.length ? reviewButton() : ""}</div>`;
}
// na estante: acesso à revisão
function wordsHomeHTML() {
  const n = loadWords().length;
  // aparece sempre, mesmo vazio, para o aluno descobrir o recurso
  return `<div class="card" id="w-home"><p class="sec-t" style="margin-top:0">My words <span>· minhas palavras</span></p>
    ${n ? `<p class="hint">${n} ${n === 1 ? "palavra consultada" : "palavras consultadas"} no glossário, guardadas neste aparelho.</p>${reviewButton()}`
         : `<p class="hint">Toque nas palavras sublinhadas durante a leitura: elas ficam guardadas aqui para você revisar depois.</p>`}</div>`;
}

// revisão em cartões, no mesmo painel das configurações (não mexe na leitura)
let rv = null;
function openWords() {
  const ws = loadWords().sort((a, b) => (a.ok - b.ok) || (b.t - a.t));   // as que ainda não sabe vêm primeiro
  rv = { deck: ws.slice(0, 10), i: 0, ok: 0, shown: false, armed: false };
  openSheet(wordsHTML());
}
function wordsHTML() {
  const all = loadWords(), head = `<h2 id="st-t">My words <span>· minhas palavras</span></h2>`;
  const done = `<button type="button" class="btn primary" id="st-close">Done <span>· pronto</span></button>`;
  if (!all.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p>Toque nas palavras sublinhadas durante a leitura: elas aparecem aqui para você revisar.</p>${done}</div>`;
  if (rv.i >= rv.deck.length) return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="wscore">You knew ${rv.ok} of ${rv.deck.length}! <span>· você sabia ${rv.ok} de ${rv.deck.length}</span></p>
    <div class="choices"><button type="button" class="btn center" id="w-again">Review again <span>· revisar de novo</span></button></div>
    <p class="sec-t">All my words <span>· todas as minhas palavras (${all.length})</span></p>${wordsList(all)}
    <button type="button" class="help-btn" id="w-clear">${rv.armed ? "Tap again to delete <span>· toque de novo para apagar</span>" : "Clear my words <span>· apagar minhas palavras</span>"}</button>
    <div class="choices">${done}</div></div>`;
  const w = rv.deck[rv.i];
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-t">${head}
    <p class="hint">Card ${rv.i + 1} of ${rv.deck.length} · cartão ${rv.i + 1} de ${rv.deck.length}</p>
    <div class="wcard" aria-live="polite"><b>${esc(w.en)}</b>${rv.shown ? `<span>= ${esc(w.pt)}</span>` : `<span class="hint">O que significa? · What does it mean?</span>`}</div>${sayButton(w.en)}
    ${rv.shown ? `<div class="wbtns"><button type="button" class="btn primary" id="w-yes">I knew it ✓ <span>· eu sabia</span></button>
      <button type="button" class="btn center" id="w-no">Not yet ↻ <span>· ainda não</span></button></div>`
      : `<button type="button" class="btn primary" id="w-show">Show the translation <span>· ver a tradução</span></button>`}
    <div class="choices">${done.replace("btn primary", "btn center")}</div></div>`;
}
function redrawWords(focusId) {
  $("#settings").innerHTML = wordsHTML();
  const f = (focusId && $("#" + focusId)) || $("#settings .sheet button");
  if (f) f.focus();
}
function wordsClick(e) {
  const b = e.target.closest("#w-show, #w-yes, #w-no, #w-again, #w-clear");
  if (!b) return false;
  if (b.id === "w-show") { rv.shown = true; redrawWords("w-yes"); }
  else if (b.id === "w-yes" || b.id === "w-no") {
    const ws = loadWords(), w = ws.find(x => x.k === rv.deck[rv.i].k);
    if (w) { w.ok = b.id === "w-yes" ? w.ok + 1 : 0; saveWords(ws); }
    if (b.id === "w-yes") rv.ok++;
    rv.i++; rv.shown = false; redrawWords("w-show");
  }
  else if (b.id === "w-again") openWords();
  else if (b.id === "w-clear") {
    if (rv.armed) { saveWords([]); rv.armed = false; redrawWords(); }
    else { rv.armed = true; redrawWords("w-clear"); setTimeout(() => { if (rv && rv.armed) { rv.armed = false; if (!$("#settings").hidden && $("#w-clear")) redrawWords("w-clear"); } }, 4000); }
  }
  return true;
}

/* ---------------- glossário: balão e 1ª ocorrência ---------------- */
document.addEventListener("click", e => {
  const tip = $("#tip"), g = e.target.closest(".gloss");
  if (!g || !glossOn || (g.classList.contains("a1") && SET.gloss !== "a1")) { tip.classList.remove("on"); return; }
  if (g.classList.contains("verb")) {
    const [b, p, pp, pt] = IRREG[+g.dataset.v], on = g.dataset.cols ? g.dataset.cols.split(",").map(Number) : [];
    tip.innerHTML = `<div class="vt">${[["infinitive", b], ["past", p], ["participle", pp]].slice(0, verbForms()).map(([l, f], i) => `<div class="vc${on.includes(i) ? " on" : ""}"><span>${l}</span><b>${esc(f)}</b></div>`).join("")}</div><div class="vpt">= ${esc(pt)}</div>`;
    rememberWord("v:" + b, [b, p, pp].slice(0, verbForms()).join(" · "), pt);
  } else { tip.textContent = g.textContent + (g.dataset.base ? ` (${g.dataset.base})` : "") + " = " + g.dataset.pt; rememberWord("g:" + wordOf(g), wordOf(g), g.dataset.pt); }
  tip.classList.add("on");
  fala(g.textContent);
  const r = g.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - tip.offsetWidth - 8)) + "px";
  const above = r.top - tip.offsetHeight - 6;
  tip.style.top = (window.scrollY + (above > 8 ? above : r.bottom + 6)) + "px";
});
function dedupeGloss() {
  const seen = new Set(), all = [...$("#app").querySelectorAll(".gloss")];
  const word = el => el.textContent.trim().toLowerCase();
  // uma palavra do glossário normal nunca perde a vez para a mesma palavra do nível A1
  const normal = new Set(all.filter(el => !el.classList.contains("a1") && !el.classList.contains("verb")).map(word));
  all.forEach(el => {
    const a1 = el.classList.contains("a1");
    const key = (el.classList.contains("verb") ? "v:" : a1 ? "a:" : "g:") + word(el);
    if (seen.has(key) || (a1 && normal.has(word(el)))) el.replaceWith(...el.childNodes); else seen.add(key);
  });
  glossTabs();
}
// palavras do nível A1 só entram na ordem do Tab quando esse nível está ligado
function glossTabs() {
  const on = SET.gloss === "a1";
  document.querySelectorAll(".gloss.a1").forEach(el => { el.tabIndex = on ? 0 : -1; });
}
new MutationObserver(dedupeGloss).observe($("#app"), { childList: true, subtree: true });

route();
</script>
